name: libmodsecurity-patch-ab

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Number of paired order-rotated measurement repeats
        required: true
        default: 10
        type: number
      request_scale:
        description: Multiplier applied to measurement request counts
        required: true
        default: 5
        type: number

permissions:
  contents: read

concurrency:
  group: libmodsecurity-patch-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Linux release ThinLTO patch A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Detect runner data disk
        id: disk
        shell: bash
        run: |
          mnt_available=false
          if mountpoint --quiet /mnt; then
            mnt_available=true
          fi
          echo "mnt-available=${mnt_available}" >> "${GITHUB_OUTPUT}"

      - name: Use runner data disk
        if: steps.disk.outputs.mnt-available == 'true'
        uses: envoyproxy/toolshed/actions/bind-mounts@1f5b552c6749502b885cb8cf23549b929e745547 # actions-v0.4.17
        with:
          mounts: |
            - src: /mnt/docker
              target: /var/lib/docker
              rm: true
              command-pre: sudo systemctl stop docker
              command-post: sudo systemctl start docker
            - src: /mnt/workspace
              target: GITHUB_WORKSPACE
              chown: runner:runner
            - src: /mnt/envoy-build
              target: RUNNER_TEMP/envoy-build
              chown: runner:runner

      - name: Free root disk space
        if: steps.disk.outputs.mnt-available != 'true'
        uses: envoyproxy/toolshed/actions/diskspace@1f5b552c6749502b885cb8cf23549b929e745547 # actions-v0.4.17
        with:
          background: false

      - name: Check out pinned project sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Test performance tooling
        run: |
          python3 -m unittest test/tools/waf_engine_comparison_test.py

      - name: Build and compare both variants in pinned Envoy image
        env:
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
          BENCHMARK_REQUEST_SCALE: ${{ inputs.request_scale }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          ENVOY_BUILD_IMAGE: docker.io/envoyproxy/envoy-build@sha256:9e7dee3f9ce05274cfeb79a629b6b4f9163edb7bed436daa567ca7b58a35dfac
          ENVOY_DOCKER_BUILD_DIR: ${{ runner.temp }}/envoy-build
          SOURCE_DIR: ${{ github.workspace }}
        run: |
          mkdir --parents "${ENVOY_DOCKER_BUILD_DIR}"
          docker run --rm \
            --user root:root \
            --volume "${ENVOY_DOCKER_BUILD_DIR}:/build" \
            --volume "${SOURCE_DIR}:/source" \
            --workdir /source \
            --env BENCHMARK_REPEATS \
            --env BENCHMARK_REQUEST_SCALE \
            --env BUILDBUDDY_API_KEY \
            --env ENVOY_BUILD_IMAGE \
            --env HOME=/build \
            --entrypoint /bin/bash \
            "${ENVOY_BUILD_IMAGE}" \
            ./tools/ci-libmodsecurity-patch-ab.sh

      - name: Publish A/B summary
        if: ${{ always() && hashFiles('artifacts/libmodsecurity-patch-ab/libmodsecurity-patch-ab.md') != '' }}
        run: cat artifacts/libmodsecurity-patch-ab/libmodsecurity-patch-ab.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload A/B report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libmodsecurity-patch-ab-linux-amd64
          path: artifacts/libmodsecurity-patch-ab/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Report disk usage
        if: always()
        run: df --human-readable
